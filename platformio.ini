[platformio]
; Sketch folder is shared with the Arduino IDE: the folder name must match
; the .ino file name, and any .cpp/.h files added there are built by both.
src_dir = firmware

[env:sparkfun_esp32micromod]
platform = espressif32@7.1.0
board = sparkfun_esp32micromod
framework = arduino
monitor_speed = 115200

; PIO's board def claims 4MB; this board has 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv